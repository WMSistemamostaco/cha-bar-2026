const guests = getGuests();
const totalP = guests.reduce((s,g) => s + g.count, 0);
document.getElementById('totalConf').textContent = guests.length;
document.getElementById('totalPess').textContent = totalP;
document.getElementById('totalAgu').textContent  = Math.max(0, LIMITE - totalP);

const ul = document.getElementById('painelList');
const originLabel = { form:'🌐 site', gmail:'📬 e-mail', manual:'✏️ manual' };

if(!guests.length){
ul.innerHTML = '<li style="text-align:center;color:gray;padding:12px 0;">Sem confirmações ainda.</li>';
} else {
ul.innerHTML = '';
guests.forEach((g, i) => {
const li = document.createElement('li');
li.className = 'guest-item';
li.innerHTML = `
       <span class="guest-name">${g.name}
         <span class="guest-origin">${originLabel[g.origin] || ''}</span>
       </span>
       <span class="guest-badge">${g.count}p</span>
       <button class="guest-del" onclick="removerConvidado(${i})" title="Remover">✕</button>`;
ul.appendChild(li);
});
}
document.getElementById('lastUp').textContent = 'Atualizado em: ' + new Date().toLocaleTimeString('pt-BR');

function removerConvidado(i){
const guests = getGuests();
if(!confirm(`Remover "${guests[i].name}"?`)) return;
guests.splice(i, 1); saveGuests(guests); atualizarPainel();
}

function limparDados(){
